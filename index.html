<title>Daily Vigilance Quiz · दैनिक सतर्कता प्रश्नोत्तरी · AIIMS Bhopal</title>
<meta name="description" content="Daily online quiz on preventive vigilance for employees of AIIMS Bhopal, organised by the Vigilance Cell during Vigilance Awareness Week 2026.">
<link rel="icon" href="favicon.png">
<style>

  .top img{width:72px;height:auto;flex:none}
  .org-hi{font-size:.85rem;color:var(--muted);margin:0}
  .org-en{font-size:1.02rem;font-weight:700;color:var(--indigo-d);margin:0;line-height:1.25}

  .vaw{background:linear-gradient(90deg,var(--indigo-d),var(--indigo));color:#fff}

  .vaw b{font-size:.98rem}
  .vaw span{font-size:.88rem;opacity:.92}
  main{max-width:780px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  h1{font-size:1.35rem;margin:0 0 4px;color:var(--indigo-d)}
  h2{font-size:1.08rem;margin:0 0 10px}
  .muted{color:var(--muted);font-size:.92rem}
  .pill{display:inline-block;background:var(--green-l);color:var(--green);font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px}
  .pill.off{background:#fdecea;color:var(--warn)}
  ul.rules{padding-left:20px;margin:8px 0}
  ul.rules li{margin:4px 0}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input[type=text],input[type=email],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  input:focus,select:focus{outline:2px solid var(--indigo);border-color:transparent}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.top img{width:56px}.top-in{gap:10px}#lang{padding:5px 10px;font-size:.88rem}}

  button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;background:var(--indigo);color:#fff}

  button:disabled{opacity:.55;cursor:wait}
  .err{color:var(--warn);font-size:.92rem;margin-top:10px;min-height:1.2em}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.links{grid-template-columns:1fr}}
  .linkcard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}

  .linkcard.feature{background:var(--tint);border-color:#c9cdf0}
  .q{counter-increment:q}
  .q h3{font-size:1rem;margin:0 0 10px;font-weight:600}
  .q h3::before{content:"Q" counter(q) ". ";color:var(--indigo)}
  html[lang=hi] .q h3::before{content:"प्रश्न " counter(q) ". "}
  #qs{counter-reset:q}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer}

  .opt.sel{border-color:var(--indigo);background:var(--tint)}
  #timerbar{position:sticky;top:0;z-index:5;background:var(--indigo);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-weight:700}

  #clock{font-variant-numeric:tabular-nums;font-size:1.2rem}
  #lang2{background:transparent;border:1px solid rgba(255,255,255,.6);padding:3px 10px;font-size:.85rem;border-radius:999px;margin-left:auto}
  .center{text-align:center}

  .counter .l{font-size:.9rem;color:var(--muted);margin-top:4px}

  .test{background:#fff4e5;border:1px solid #f5c37a;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let LANG = (qp.get("lang") === "hi" || qp.get("lang") === "en") ? qp.get("lang") : (store.get(K_LANG) || "en");

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const srvMsg = r => (LANG === "hi" && r.message_hi) ? r.message_hi : r.message;
const catLabel = c => CAT_HI[c] ? `${c} / ${CAT_HI[c]}` : c;

function applyLang(){
  document.documentElement.lang = LANG;
  document.getElementById("lang").textContent = t("switchTo");
  document.getElementById("lang2").textContent = t("switchTo");
  document.getElementById("foot").textContent = t("foot");
}
function toggleLang(){
  LANG = LANG === "en" ? "hi" : "en"; store.set(K_LANG, LANG); applyLang();
  if (current) current();
}
document.getElementById("lang").onclick = toggleLang;
document.getElementById("lang2").onclick = toggleLang;

async function api(method, body){
  let last;
  for (let i = 0; i < 4; i++){
    try{
      const res = method === "GET"
        ? await fetch(CONFIG.API_URL + "?t=" + Date.now())
        : await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(body) });
      const j = await res.json();
      if (j && j.code === "SERVER_ERROR" && i < 3){ await sleep(1500 * (i+1)); continue; }
      return j;
    }catch(e){ last = e; await sleep(1500 * (i+1)); }
  }
  throw last || new Error("network");
}

function linksBlock(feature){
  return `<div class="links">
    <a class="linkcard ${feature ? "feature" : ""}" href="${CONFIG.NEWSLETTER_URL}" target="_blank" rel="noopener">
      <b>📰 ${t("newsTitle")}</b><span class="muted">${t("newsText")}</span></a>
    <a class="linkcard" href="${CONFIG.PLEDGE_URL}" target="_blank" rel="noopener">
      <b>✋ ${t("pledgeTitle")}</b><span class="muted">${t("pledgeText")}</span></a>
  </div>`;
}
const testBanner = () => TEST ? `<div class="test"><b>TEST MODE</b>: attempts are tagged TEST and excluded from results.${TEST.testDay ? " Day " + esc(TEST.testDay) + "." : ""}</div>` : "";

function counterCard(after){
  const c = STATUS && STATUS.counts;
  if (!c) return "";
  const nf = n => Number(n || 0).toLocaleString(t("locale"));
  const cats = (STATUS.categories || CATEGORIES_FALLBACK).filter(k => c.byCategory && c.byCategory[k])
    .map(k => `${esc(LANG === "hi" && CAT_HI[k] ? CAT_HI[k] : k)} <b>${nf(c.byCategory[k])}</b>`).join(" · ");
  return `<div class="card"><div class="counter">
      <div><div class="n">${nf(c.today)}</div><div class="l">${t("cToday")}</div></div>
      <div><div class="n">${nf(c.week)}</div><div class="l">${t("cWeek")}</div></div>
    </div>${cats ? `<div class="cats">${cats}</div>` : ""}
    <p class="muted center" style="margin:10px 0 0"><b>${t(after ? "cDone" : "cJoin")}</b></p></div>`;
}

function fmtDay(n){
  const d0 = new Date(STATUS.date + "T12:00:00+05:30");
  const d = new Date(d0.getTime() + (n - STATUS.day) * 86400000);
  return d.toLocaleDateString(t("locale"), { day: "numeric", month: "short", timeZone: "Asia/Kolkata" });
}

/* ---------------- screens ---------------- */
function screenHome(msg){
  current = () => { const f = readForm(); screenHome(msg); fillForm(f); };
  bar.hidden = true;
  const s = STATUS;
  const open = s.open || TEST;
  const pill = open
    ? `<span class="pill">${esc(t("pillOpen", { d: TEST && TEST.testDay ? TEST.testDay : s.day, n: s.totalDays, close: s.closeTime }))}</span>`
    : `<span class="pill off">${t("pillClosed")}</span>`;
  const p = store.get(K_PROFILE) || {};
  const cats = (s.categories && s.categories.length ? s.categories : CATEGORIES_FALLBACK)
    .map(c => `<option value="${esc(c)}" ${p.category === c ? "selected" : ""}>${esc(catLabel(c))}</option>`).join("");
  const mins = Math.round((s.durationSec || 600) / 60);
  app.innerHTML = `${testBanner()}
  <div class="card">
    <h1>${t("title")}</h1>
    <p style="margin:0 0 8px">${pill}</p>
    <p class="muted" style="margin:0">${esc(t("intro", { from: fmtDay(1), to: fmtDay(s.totalDays), open: s.openTime, close: s.closeTime }))}</p>
    ${!open ? `<p style="margin:10px 0 0"><b>${esc(srvMsg(s))}</b></p>` : ""}
  </div>
  ${counterCard(false)}
  ${open ? `
  <div class="card">
    <h2>${t("before")}</h2>
    <ul class="rules">${T[LANG].rules.map(r => `<li>${r.split("{m}").join(mins)}</li>`).join("")}</ul>
  </div>
  <div class="card">
    <h2>${t("details")}</h2>
    <div class="grid">
      <div><label for="f-emp">${t("empId")} <span class="req">*</span></label><input type="text" id="f-emp" value="${esc(p.empId)}" autocomplete="off" required></div>
      <div><label for="f-name">${t("name")} <span class="req">*</span></label><input type="text" id="f-name" value="${esc(p.name)}" autocomplete="name" required></div>
      <div><label for="f-email">${t("email")} <span class="req">*</span></label><input type="email" id="f-email" value="${esc(p.email)}" autocomplete="email" required></div>
      <div><label for="f-cat">${t("category")} <span class="req">*</span></label><select id="f-cat" required><option value="">${t("select")}</option>${cats}</select></div>
      <div><label for="f-dept">${t("dept")} <span class="req">*</span></label><input type="text" id="f-dept" value="${esc(p.department)}" required></div>
      <div><label for="f-desig">${t("desig")} <span class="req">*</span></label><input type="text" id="f-desig" value="${esc(p.designation)}" required></div>
    </div>
    <p class="muted" style="margin:12px 0 0">${t("sameId")}</p>
    <div class="err" id="f-err">${esc(msg || "")}</div>
    <div style="margin-top:6px"><button id="b-start">${t("start")}</button></div>
  </div>` : ""}
  ${linksBlock(!open)}`;
  const b = document.getElementById("b-start");
  if (b) b.onclick = startQuiz;
}

function readForm(){
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  return { emp: g("f-emp"), name: g("f-name"), email: g("f-email"), cat: g("f-cat"), dept: g("f-dept"), desig: g("f-desig") };
}
function fillForm(f){
  if (!f) return;
  const s = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  s("f-emp", f.emp); s("f-name", f.name); s("f-email", f.email); s("f-cat", f.cat); s("f-dept", f.dept); s("f-desig", f.desig);
}

function screenMsg(titleKey, body, showLinks = true){
  current = () => screenMsg(titleKey, body, showLinks);
  bar.hidden = true;
  const text = typeof body === "function" ? body() : body;
  app.innerHTML = `${testBanner()}<div class="card center"><h2>${t(titleKey)}</h2><p>${esc(text)}</p></div>${showLinks ? linksBlock(true) : ""}`;
}

async function startQuiz(){
  const v = id => document.getElementById(id).value.trim();
  const profile = { empId: v("f-emp").toUpperCase(), name: v("f-name"), email: v("f-email"), category: v("f-cat"), department: v("f-dept"), designation: v("f-desig") };
  const err = document.getElementById("f-err");
  if (Object.values(profile).some(x => !x)){ err.textContent = t("fillAll"); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(profile.email)){ err.textContent = t("badEmail"); return; }
  const mins = Math.round((STATUS.durationSec || 600) / 60);
  if (!confirm(t("confirmStart", { name: profile.name, id: profile.empId, m: mins }))) return;
  store.set(K_PROFILE, profile);
  const b = document.getElementById("b-start"); b.disabled = true; b.textContent = t("starting"); err.textContent = "";
  try{
    const r = await api("POST", Object.assign({ action: "start" }, profile, TEST || {}));
    if (!r.ok){
      if (r.code === "DONE_TODAY") return screenMsg("alreadyTitle", () => srvMsg(r));
      b.disabled = false; b.textContent = t("start"); err.textContent = srvMsg(r) || t("couldNotStart"); return;
    }
    const attempt = {
      attemptId: r.attemptId, day: r.day, deadline: r.deadline, offset: r.serverNow - Date.now(),
      questions: r.questions, order: shuffle(r.questions.map((_, i) => i)),
      optOrder: r.questions.map(() => shuffle(["A","B","C","D"])),
      answers: {}, tabs: 0, profile
    };
    store.set(K_ATT, attempt);
    screenQuiz(attempt);
  }catch(e){
    b.disabled = false; b.textContent = t("start");
    err.textContent = t("noServerStart");
  }
}

function qText(q){ return (LANG === "hi" && q.qh) ? q.qh : q.q; }
function oText(q, L){ return (LANG === "hi" && q.oh && q.oh[L]) ? q.oh[L] : q.o[L]; }

function screenQuiz(a){
  current = () => { const y = window.scrollY; screenQuiz(a); window.scrollTo(0, y); };
  bar.hidden = false;
  app.innerHTML = `${testBanner()}<div class="card" style="padding:12px 18px"><b>${esc(t("day", { d: a.day }))}</b> · ${esc(a.profile.name)} (${esc(a.profile.empId)})</div>
    <div id="qs"></div>
    <div class="card"><button id="b-submit">${t("submit")}</button><div class="err" id="s-err"></div></div>`;
  const qs = document.getElementById("qs");
  a.order.forEach(i => {
    const q = a.questions[i];
    const div = document.createElement("div"); div.className = "card q";
    div.innerHTML = `<h3>${esc(qText(q))}</h3>` + a.optOrder[i].map((L, k) => {
      const id = `q${i}${L}`, chk = a.answers[q.id] === L;
      const lab = LANG === "hi" ? "कखगघ"[k] : "abcd"[k];
      return `<label class="opt ${chk ? "sel" : ""}" for="${id}"><input type="radio" name="q${i}" id="${id}" value="${L}" ${chk ? "checked" : ""}><span><b>${lab})</b> ${esc(oText(q, L))}</span></label>`;
    }).join("");
    div.addEventListener("change", e => {
      a.answers[q.id] = e.target.value;
      div.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.querySelector("input").checked));
      store.set(K_ATT, a); progress(a);
    });
    qs.appendChild(div);
  });
  document.getElementById("b-submit").onclick = () => {
    const left = a.questions.length - Object.keys(a.answers).length;
    if (left && !confirm(t("unanswered", { n: left }))) return;
    submit(a);
  };
  document.onvisibilitychange = () => { if (document.hidden && !submitting){ a.tabs++; store.set(K_ATT, a); } };
  progress(a);
  const clock = document.getElementById("clock");
  const step = () => {
    const ms = a.deadline - (Date.now() + a.offset);
    if (ms <= 0){ clock.textContent = "00:00"; clearInterval(tick); submit(a, true); return; }
    const s = Math.ceil(ms / 1000);
    clock.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
    bar.classList.toggle("low", s <= 60);
  };
  clearInterval(tick); step(); tick = setInterval(step, 500);
}

function progress(a){
  document.getElementById("progress").textContent = t("answered", { n: Object.keys(a.answers).length, t: a.questions.length });
}

function screenDone(a, r, timeUp){
  current = () => screenDone(a, r, timeUp);
  const last = STATUS && (a.day >= STATUS.totalDays);
  bar.hidden = true;
  app.innerHTML = `${testBanner()}
    <div class="card center">
      <h2>${t(timeUp ? "timeUpTitle" : "doneTitle")}</h2>
      <p class="muted" style="margin:0">${esc(t("scoreFor", { d: a.day, name: a.profile.name, id: a.profile.empId }))}</p>
      <div class="score">${esc(r.score)} / ${esc(r.total)}</div>
      ${r.late ? `<p class="muted">${t("lateNote")}</p>` : ""}
      <p style="margin:6px 0 0">${last ? t("lastDay") : t("comeBack")}</p>
    </div>
    ${counterCard(true)}
    ${linksBlock(true)}`;
}

function screenRetry(a, timeUp){
  current = () => screenRetry(a, timeUp);
  bar.hidden = true;
  app.innerHTML = `<div class="card center"><h2>${t("retryTitle")}</h2><p>${t("retryText")}</p><button id="b-retry">${t("retry")}</button></div>`;
  document.getElementById("b-retry").onclick = () => submit(a, timeUp);
}

async function submit(a, timeUp){
  if (submitting) return; submitting = true; clearInterval(tick);
  document.onvisibilitychange = null;
  const b = document.getElementById("b-submit"); if (b){ b.disabled = true; b.textContent = t("submitting"); }
  try{
    const r = await api("POST", { action: "submit", attemptId: a.attemptId, answers: a.answers, tabs: a.tabs });
    if (!r.ok) throw new Error(r.message || "submit failed");
    store.del(K_ATT);
    screenDone(a, r, timeUp);
    api("GET").then(st => { STATUS = st; if (current) current(); }).catch(() => {});
  }catch(e){
    submitting = false;
    screenRetry(a, timeUp);
  }
}

/* ---------------- start ---------------- */
(async function init(){
  applyLang();
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL)){
    app.innerHTML = `<div class="card"><b>Setup incomplete:</b> the quiz server address has not been added to this page yet.</div>`; return;
  }
  const a = store.get(K_ATT);
  try{ STATUS = await api("GET"); }
  catch(e){ return screenMsg("noServerTitle", () => t("noServerText"), false); }
  if (a && a.attemptId){
    if (a.deadline - (Date.now() + (a.offset || 0)) > 0) return screenQuiz(a);
    return submit(a, true);
  }
  screenHome();
})();
</script>
</body>
